name: Publish to npm

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'

      - name: Installing dependencies
        run: npm ci

      - name: Building main.js
        run: npm run build

      - name: Checking JS wrapper version is not already published
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "Attempting to publish $PACKAGE_NAME@$PACKAGE_VERSION"
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version 2>/dev/null; then
            echo "::error::Version $PACKAGE_VERSION is already published. Bump the version in package.json before merging."
            exit 1
          fi

      - name: Publishing to npmjs
        run: npm publish --provenance

      - name: Verify package contents
        run: |
            test -f dist/main.js
            test -f dist/main.js.map
            npm pack --dry-run